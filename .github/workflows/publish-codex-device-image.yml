name: Publish Codex device image

on:
  push:
    branches: [publish/codex-device-v0.2.23-image]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 47seek
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/47seek/sub2api:0.2.23-codex
          build-args: |
            VERSION=0.2.23-codex-device.1
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.2.23-codex-device.1
            org.opencontainers.image.source=https://github.com/47seek/sub2api
